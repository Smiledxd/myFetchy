<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myFetchy</title>

    <!-- PWA y Manifest -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2A4A8D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="myFetchy" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />

    <!-- Tipografías institucionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Khand:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos (Ruta relativa) -->
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <!-- Banner de Modo Sin Conexión -->
    <div id="offline-banner" class="offline-banner" style="display: none">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      Sin conexión. Estás viendo tu última copia.
    </div>

    <!-- Vista de Autenticación -->
    <main id="auth-view" class="auth-view">
      <div class="auth-card">
        <h1 class="font-heading">MY<span>FETCHY</span></h1>
        <p class="auth-desc">Tus links, apuntes y archivos en un solo lugar.</p>

        <form id="login-form">
          <div class="form-group" style="text-align: left">
            <label for="login-email" class="form-label">Correo electrónico</label>
            <input
              type="email"
              id="login-email"
              class="form-control"
              placeholder="tu@correo.com"
              required
              autocomplete="email"
            />
          </div>
          <button
            type="submit"
            id="btn-login"
            class="btn-primary"
            style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px"
          >
            Enviarme el link
          </button>
        </form>

        <p
          id="login-msg"
          style="margin-top: 16px; font-size: 0.9rem; min-height: 24px; font-weight: 500"
        ></p>
      </div>
    </main>

    <!-- Vista Principal de la Aplicación -->
    <div id="app-view" style="display: none">
      <!-- Encabezado y Barra de Búsqueda Fija -->
      <header class="app-header">
        <div class="container">
          <div class="header-top">
            <div class="logo-wrap">
              <h1 class="app-logo">MY<span>FETCHY</span></h1>
            </div>
            <div class="header-actions">
              <button id="btn-new-item" class="btn-primary" title="Guardar nuevo enlace o nota">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Guardar
              </button>

              <!-- Botón Menú con Dropdown -->
              <button id="btn-menu" class="btn-icon" title="Opciones y gestión">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <line x1="3" y1="12" x2="21" y2="12"></line>
                  <line x1="3" y1="6" x2="21" y2="6"></line>
                  <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
              </button>

              <!-- Menú Desplegable -->
              <div id="header-menu-dropdown" class="menu-dropdown">
                <button
                  type="button"
                  id="menu-item-install"
                  class="menu-item"
                  style="display: none"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  Instalar app
                </button>
                <button type="button" class="menu-item" data-mgmt="tags">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                    ></path>
                    <line x1="7" y1="7" x2="7.01" y2="7"></line>
                  </svg>
                  Etiquetas
                </button>
                <button type="button" class="menu-item" data-mgmt="collections">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
                    ></path>
                  </svg>
                  Colecciones
                </button>
                <button type="button" class="menu-item" data-mgmt="archived">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="21 8 21 21 3 21 3 8"></polyline>
                    <rect x="1" y="3" width="22" height="5"></rect>
                    <line x1="10" y1="12" x2="14" y2="12"></line>
                  </svg>
                  Archivados
                </button>
                <div class="menu-divider"></div>
                <button
                  type="button"
                  id="btn-logout"
                  class="menu-item"
                  style="color: var(--danger-color)"
                >
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  Salir
                </button>
              </div>
            </div>
          </div>

          <!-- Buscador -->
          <div class="search-bar-wrap">
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Buscar por título, nota, link o etiqueta..."
              autocomplete="off"
            />
            <button id="search-clear" class="search-clear" title="Limpiar búsqueda">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
            <span class="search-shortcut-hint">/</span>
          </div>
        </div>

        <!-- Barra de Filtros Compacta de una sola fila -->
        <div class="container">
          <div class="filter-bar-wrap">
            <select id="filter-collection" class="filter-select" title="Filtrar por colección">
              <option value="todas">📁 Todas las colecciones</option>
              <option value="sin-coleccion">Sin colección</option>
            </select>

            <select id="filter-type" class="filter-select" title="Filtrar por tipo">
              <option value="todos">Todos los tipos</option>
              <option value="link">Links</option>
              <option value="pagina">Páginas</option>
              <option value="archivo">Archivos</option>
              <option value="apunte">Apuntes</option>
            </select>

            <select id="filter-sort" class="filter-select" title="Ordenar por">
              <option value="recientes">Más recientes</option>
              <option value="edicion">Última edición</option>
              <option value="abierto">Último abierto</option>
              <option value="nombre">Nombre A-Z</option>
            </select>
          </div>
        </div>
      </header>

      <!-- Barra de Filtros por Etiqueta -->
      <div class="container">
        <div id="tag-chips-wrap" class="tag-chips-wrap"></div>
      </div>

      <!-- Contenedor Principal de Items -->
      <main class="container">
        <!-- Sección de Fijados -->
        <section id="pinned-section" style="display: none; margin-bottom: 24px">
          <h2 class="section-title">
            <span>Fijados</span>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="12" y1="17" x2="12" y2="22"></line>
              <path
                d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"
              ></path>
            </svg>
          </h2>
          <div id="pinned-list" class="items-grid"></div>
        </section>

        <!-- Sección de Resultados o Últimos guardados -->
        <section id="recent-section">
          <h2 id="recent-section-title" class="section-title">Lo último que guardaste</h2>
          <div id="recent-list" class="items-grid"></div>
        </section>
      </main>
    </div>

    <!-- Modal / Bottom Sheet Formulario de Item -->
    <div id="item-modal-overlay" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title font-heading">Guardar nuevo</h2>
          <button id="btn-close-modal" class="btn-icon" title="Cerrar">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Aviso de Enlace Duplicado -->
        <div id="duplicate-notice" style="display: none"></div>

        <form id="item-form" onsubmit="return false;">
          <div class="form-group">
            <label for="item-url" class="form-label">Enlace (opcional para apuntes)</label>
            <input
              type="text"
              id="item-url"
              class="form-control"
              placeholder="github.com/usuario o https://..."
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="item-title" class="form-label">Nombre o Título</label>
            <input
              type="text"
              id="item-title"
              class="form-control"
              placeholder="Título descriptivo"
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="item-collection" class="form-label">Colección</label>
            <select id="item-collection" class="form-control">
              <option value="">Sin colección</option>
            </select>
            <!-- Formulario Inline para Nueva Colección (Sin prompt nativo) -->
            <div
              id="inline-new-col-box"
              class="mgmt-create-box"
              style="display: none; margin-top: 8px"
            >
              <input
                type="text"
                id="inline-new-col-input"
                class="form-control"
                placeholder="Nombre de la nueva colección..."
                autocomplete="off"
              />
              <div style="display: flex; gap: 6px; margin-top: 6px">
                <button type="button" class="btn-sm btn-primary" id="btn-save-inline-col">
                  Crear
                </button>
                <button type="button" class="btn-sm btn-secondary" id="btn-cancel-inline-col">
                  Cancelar
                </button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Tipo</label>
            <div class="type-selector">
              <button type="button" class="type-btn selected" data-type="link">Link</button>
              <button type="button" class="type-btn" data-type="pagina">Página</button>
              <button type="button" class="type-btn" data-type="archivo">Archivo</button>
              <button type="button" class="type-btn" data-type="apunte">Apunte</button>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Etiquetas</label>
            <div class="tags-input-container">
              <div
                id="selected-tags-wrap"
                style="display: inline-flex; flex-wrap: wrap; gap: 4px"
              ></div>
              <input
                type="text"
                id="item-tag-input"
                class="tag-text-input"
                placeholder="Escribe y presiona Enter..."
                autocomplete="off"
              />
            </div>
            <div
              id="suggested-tags-wrap"
              style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px"
            ></div>
          </div>

          <div class="form-group">
            <label for="item-note" class="form-label">Nota o apunte</label>
            <textarea
              id="item-note"
              class="form-control"
              placeholder="Detalles, ideas o fragmentos importantes..."
            ></textarea>
          </div>

          <div class="modal-actions">
            <div style="display: flex; gap: 6px">
              <button type="button" id="btn-delete-item" class="btn-delete" style="display: none">
                Borrar
              </button>
              <button
                type="button"
                id="btn-archive-item"
                class="btn-secondary"
                style="display: none"
              >
                Archivar
              </button>
            </div>
            <div style="display: flex; gap: 8px; margin-left: auto">
              <button
                type="button"
                id="btn-save-item"
                class="btn-primary"
                style="padding: 10px 20px"
              >
                Guardar
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Gestión (Etiquetas, Colecciones, Archivados) -->
    <div id="mgmt-modal-overlay" class="modal-overlay">
      <div class="modal-sheet">
        <div class="modal-header">
          <h2 id="mgmt-title" class="modal-title font-heading">Gestión</h2>
          <button id="btn-close-mgmt" class="btn-icon" title="Cerrar">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="mgmt-body"></div>
      </div>
    </div>

    <!-- Contenedor de Toasts -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script Principal de la App (Módulos ES nativos con ruta relativa) -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
